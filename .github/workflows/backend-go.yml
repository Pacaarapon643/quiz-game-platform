name: Go Backend CI/CD
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend-go/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-go/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Install dependencies
        working-directory: ./backend-go
        run: go mod download
      
      - name: Run tests
        working-directory: ./backend-go
        run: go test ./... -v
      
      - name: Build
        working-directory: ./backend-go
        run: go build -v ./...
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploy to Render will be triggered automatically"
          # หรือใช้ Render API เพื่อ trigger deploy